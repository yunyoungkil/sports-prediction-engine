name: Results Quick Update

on:
  schedule:
    # 1시간마다 (매시 17분 — 정각 혼잡 회피). 끝난 경기 결과만 받아 성적표·가상 베팅 채점 갱신
    # (GitHub 무료 예약 실행은 밀려서 실제로는 4~5시간 간격으로 돎 — 운영 점검 한도는 12시간)
    - cron: '17 * * * *'
  workflow_dispatch:

# 메인 파이프라인과 같은 그룹: 동시에 돌며 data/를 커밋하다 충돌하지 않도록 한 번에 하나씩
concurrency:
  group: sports-pipeline
  cancel-in-progress: false

jobs:
  quick-results:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 가벼운 의존성만 설치 (numpy)
        run: pip install "numpy>=1.24.0,<2.0.0"

      - name: 결과 수집 및 채점 갱신
        run: python -m tracker.quick_results

      - name: 변경된 결과 커밋 & 푸시
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/
          git diff --staged --quiet || (git commit -m "🤖 [결과 갱신] 끝난 경기 결과·성적표·가상 베팅 채점" && git pull --rebase origin master && git push)

      # [Phase 6.1] 운영 점검 경고(파이프라인 36시간 넘게 미실행 등)가 있으면 '실패'로 표시 + 텔레그램
      - name: 운영 점검 결과 확인
        id: verify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m evaluation.health_check --verify

      - name: 실행 실패 알림 (텔레그램 Secret이 있을 때만)
        if: failure() && steps.verify.outcome != 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m evaluation.health_check --notify-failure "결과 갱신"
