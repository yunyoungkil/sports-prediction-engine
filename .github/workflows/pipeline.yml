name: Sports Prediction Engine Pipeline

on:
  schedule:
    # 매일 2회 (한국시간 09:30, 18:30 = UTC 00:30, 09:30)
    # - 회차가 언제 열리든 경기 시작 전 예측 기록·가상 베팅이 빠지지 않도록 매일 실행
    # - 해외 배당(The Odds API)은 회차당 20시간에 한 번만 조회해 월 무료 한도(500) 안에서 사용
    - cron: '30 0,9 * * *'
  workflow_dispatch: # 깃허브 웹 화면에서 'Run workflow' 버튼으로 언제든 수동 즉시 실행 가능

# 수동 실행과 예약 실행이 겹치면 커밋·푸시가 충돌하므로 한 번에 하나만 (뒤 실행은 대기)
concurrency:
  group: sports-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    # 갱신된 data/ 결과를 저장소에 커밋·푸시하기 위한 쓰기 권한 (기본 GITHUB_TOKEN은 읽기 전용)
    permissions:
      contents: write

    steps:
      - name: 1. 코스 코드 체크아웃
        uses: actions/checkout@v4
        with:
          ref: master   # 예약된 순간의 커밋이 아니라 지금 master 끝 (앞 실행을 기다린 뒤 그 데이터 위에서 계산 · results.yml 참고)

      - name: 2. 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 3. 필수 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4-1. 베트맨 과거 기록 하루 1번 갱신 (AI가 쓰는 팀 최근 폼이 1주일씩 늦지 않게)
        run: |
          # 오늘(UTC) 아직 안 했으면만 — 파이프라인이 하루 여러 번 돌아도 베트맨 요청은 하루 한 번 (최근 회차 몇 개만 증분)
          if [ "$(cat data/last_archive_sync.txt 2>/dev/null)" != "$(date -u +%F)" ]; then
            python -m collector.betman_archive --years $(( $(date +%y) - 1 )) $(date +%y) && date -u +%F > data/last_archive_sync.txt               || echo "⚠️ 베트맨 과거 기록 갱신 실패 (다음 실행 때 다시)"
          fi

      - name: 4-2. 그림자 모델 파일이 없으면 학습 (Phase 7.1 shin_mkt · 기록·비교 전용)
        run: |
          if [ ! -f data/shadow_shin_mkt.json ]; then python -m models.shadow_models || echo "⚠️ 그림자 모델 학습 실패"; fi

      - name: 4. 과거 데이터 동기화 · 주간 재학습 (마지막 재학습 뒤 6일 이상 지났으면, 또는 최초 실행)
        run: |
          # 날짜 기준 — 예전엔 '수요일 UTC 3시 전 실행'이었는데 GitHub 예약이 4~5시간씩 밀려 한 번도 조건을 못 맞췄음
          # (2026-10-29 발견: 모델·아카이브가 10-25~26 수동 실행 그대로). 마지막 재학습 날짜는 data/last_retrain.txt
          LAST=$(cat data/last_retrain.txt 2>/dev/null || echo 2000-01-01)
          AGE=$(( ( $(date -u +%s) - $(date -u -d "$LAST" +%s) ) / 86400 ))
          echo "마지막 재학습 $LAST ($AGE일 전)"
          if [ ! -f "data/history/all_historical_matches.csv" ] || [ "$AGE" -ge 6 ]; then
            python collector/download_history.py
            # [Phase 5.3] 주 1회 시장 보정 모델 재학습 (게이트 미통과 시 파이프라인은 자동으로 시장 단독)
            python -m models.market_corrector
            # [Phase 5.6] 베트맨 과거 결과 아카이브 증분 수집(올해·작년 회차) → 베트맨 학습 보정 모델 재학습
            python -m collector.betman_archive --years $(( $(date +%y) - 1 )) $(date +%y)
            python -m models.betman_corrector
            # [Phase 7.1] 그림자 모델(shin_mkt) — 같은 데이터로 재학습 (기록·비교 전용)
            python -m models.shadow_models || echo "⚠️ 그림자 모델 학습 실패"
            # [Phase 5.11] 전 종목·전 유형 아카이브 증분 수집 → 유형별 보정 모델 재학습 (유형별 게이트)
            python -m collector.betman_markets_archive --years $(( $(date +%y) - 1 )) $(date +%y)
            python -m models.betman_markets
            # [Phase 6.6] 유형별 마진·우위 표 + 배당 구간별 환급률 (대시보드 성과 탭) — 실패해도 나머지 재학습은 계속
            python -m evaluation.market_scan || echo "⚠️ 유형별 마진표 갱신 실패"
            # [Phase 5.9] 배당만 쓰는 전략(D·E)의 과거 회차 재현 갱신
            python -m models.paper_trading --backfill
            date -u +%F > data/last_retrain.txt
          fi

      - name: 5. 파이프라인 실행 (베트맨 수집 -> AI 승률 예측 -> 기대가치 분석)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python run_pipeline.py

      # 저장한 데이터가 '이래야 한다'는 모양(회차·배당·확률 합·결과 코드)을 지키는지 pandera로 점검. 어긋나면 7단계가 경고 → 실행 실패로 표시
      - name: 5-1. 데이터 계약 점검 (pandera)
        run: python -m evaluation.data_contracts --write || echo "⚠️ 데이터 계약 점검 실행 실패"

      - name: 6. 갱신된 예측 결과(JSON)를 깃허브 저장소에 자동 커밋 & 푸시
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 [자동 갱신] 최신 베트맨 경기 및 AI 승부예측 결과 업데이트" && git pull --rebase origin master && git push)

      # [Phase 6.1] 데이터는 먼저 커밋해 두고, 운영 점검 경고가 있으면 이 실행을 '실패'로 표시 (GitHub 알림 메일) + 텔레그램
      - name: 7. 운영 점검 결과 확인
        id: verify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m evaluation.health_check --verify

      - name: 실행 실패 알림 (텔레그램 Secret이 있을 때만)
        if: failure() && steps.verify.outcome != 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m evaluation.health_check --notify-failure "파이프라인"
