name: Sports Prediction Engine Pipeline

on:
  schedule:
    # 프로토 승부식 발매 일정에 맞추어 매주 수요일, 금요일 한국시간 오전 09:30, 오후 14:30 실행
    # UTC 기준: 00:30, 05:30 (수, 금)
    - cron: '30 0,5 * * 3,5'
    # 주말 주요 경기 시작 직전 마감 배당 추적(CLV) 및 최종 갱신 (토/일 한국시간 13:00 / UTC 04:00)
    - cron: '0 4 * * 6,0'
  workflow_dispatch: # 깃허브 웹 화면에서 'Run workflow' 버튼으로 언제든 수동 즉시 실행 가능

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    # 갱신된 data/ 결과를 저장소에 커밋·푸시하기 위한 쓰기 권한 (기본 GITHUB_TOKEN은 읽기 전용)
    permissions:
      contents: write

    steps:
      - name: 1. 코스 코드 체크아웃
        uses: actions/checkout@v4

      - name: 2. 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 3. 필수 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. 과거 데이터 동기화 (주 1회 수요일 정기 갱신 또는 최초 실행)
        run: |
          # 파일이 없거나 매주 수요일(3)에 진행 중인 시즌의 최신 경기 결과 동기화
          if [ ! -f "data/history/all_historical_matches.csv" ] || [ "$(date +%u)" -eq 3 ]; then
            python collector/download_history.py
            # [Phase 5.3] 주 1회 시장 보정 모델 재학습 (게이트 미통과 시 파이프라인은 자동으로 시장 단독)
            python -m models.market_corrector
          fi

      - name: 5. 파이프라인 실행 (베트맨 수집 -> AI 승률 예측 -> 기대가치 분석)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python run_pipeline.py

      - name: 6. 갱신된 예측 결과(JSON)를 깃허브 저장소에 자동 커밋 & 푸시
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 [자동 갱신] 최신 베트맨 경기 및 AI 승부예측 결과 업데이트" && git pull --rebase origin master && git push)
